<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Crear Tarea</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "surface-container-lowest": "#ffffff",
                            "on-surface": "#0b1c30",
                            "on-primary-fixed-variant": "#2f2ebe",
                            "primary-container": "#6063ee",
                            "on-tertiary-container": "#000703",
                            "tertiary-fixed-dim": "#4edea3",
                            "surface-variant": "#d3e4fe",
                            "surface-container-high": "#dce9ff",
                            "outline": "#767586",
                            "secondary-fixed-dim": "#ffb95f",
                            "background": "#f8f9ff",
                            "error-container": "#ffdad6",
                            "on-primary-fixed": "#07006c",
                            "surface-container-low": "#eff4ff",
                            "surface-container": "#e5eeff",
                            "on-primary-container": "#fffbff",
                            "tertiary": "#006c49",
                            "inverse-on-surface": "#eaf1ff",
                            "on-tertiary-fixed": "#002113",
                            "tertiary-container": "#00885d",
                            "primary-fixed": "#e1e0ff",
                            "on-surface-variant": "#464554",
                            "secondary": "#855300",
                            "surface-container-highest": "#d3e4fe",
                            "on-secondary": "#ffffff",
                            "primary-fixed-dim": "#c0c1ff",
                            "on-error": "#ffffff",
                            "on-primary": "#ffffff",
                            "surface-dim": "#cbdbf5",
                            "error": "#ba1a1a",
                            "primary": "#4648d4",
                            "on-error-container": "#93000a",
                            "surface-tint": "#494bd6",
                            "inverse-surface": "#213145",
                            "on-background": "#0b1c30",
                            "surface-bright": "#f8f9ff",
                            "secondary-fixed": "#ffddb8",
                            "on-secondary-fixed-variant": "#653e00",
                            "on-secondary-container": "#684000",
                            "on-secondary-fixed": "#2a1700",
                            "on-tertiary-fixed-variant": "#005236",
                            "tertiary-fixed": "#6ffbbe",
                            "outline-variant": "#c7c4d7",
                            "on-tertiary": "#ffffff",
                            "surface": "#f8f9ff",
                            "secondary-container": "#fea619",
                            "inverse-primary": "#c0c1ff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "stack-md": "1rem",
                            "container-margin": "1.25rem",
                            "stack-lg": "1.5rem",
                            "section-gap": "2rem",
                            "stack-sm": "0.5rem",
                            "gutter": "1rem"
                    },
                    "fontFamily": {
                            "title-md": ["Inter"],
                            "label-sm": ["Inter"],
                            "display": ["Inter"],
                            "headline-lg": ["Inter"],
                            "body-lg": ["Inter"],
                            "headline-lg-mobile": ["Inter"],
                            "body-md": ["Inter"]
                    },
                    "fontSize": {
                            "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                            "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                            "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                            "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col pb-[100px] md:pb-0">
<!-- Top Navigation (Mobile/Tablet Modal Header) -->
<header class="flex justify-between items-center px-container-margin py-4 w-full bg-background sticky top-0 z-40">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-on-surface">
            Crear Tarea
        </h1>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-container-margin md:max-w-2xl md:mx-auto md:w-full space-y-section-gap pt-stack-md">
<!-- Form Section -->
<form class="space-y-stack-lg">
<!-- Title Input -->
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="task-title">Título de la tarea</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-md text-on-surface placeholder:text-outline transition-colors outline-none h-[48px]" id="task-title" placeholder="Ej. Ensayo sobre la Revolución Industrial" type="text"/>
</div>
<!-- Subject Selector -->
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Materia</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary bg-primary/10 text-primary font-label-sm text-label-sm flex items-center gap-2 h-[40px]" type="button">
<span class="w-2 h-2 rounded-full bg-primary"></span>
                        Historia
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-sm text-label-sm flex items-center gap-2 h-[40px] hover:bg-surface-container-low transition-colors" type="button">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
                        Matemáticas
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-sm text-label-sm flex items-center gap-2 h-[40px] hover:bg-surface-container-low transition-colors" type="button">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
                        Física
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-colors flex items-center justify-center w-[40px] h-[40px]" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
<!-- Date and Time Grid -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="task-date">Fecha de entrega</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">calendar_month</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg pl-10 pr-4 py-3 font-body-md text-on-surface outline-none h-[48px] appearance-none" id="task-date" type="date"/>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="task-time">Hora</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">schedule</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg pl-10 pr-4 py-3 font-body-md text-on-surface outline-none h-[48px] appearance-none" id="task-time" type="time"/>
</div>
</div>
</div>
<!-- Priority Selector -->
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Prioridad</label>
<div class="flex gap-2">
<button class="flex-1 py-2 rounded-lg border border-error bg-error/10 text-error font-label-sm text-label-sm flex items-center justify-center gap-1 h-[48px]" type="button">
<span class="material-symbols-outlined text-[16px] fill">priority_high</span>
                        Alta
                    </button>
<button class="flex-1 py-2 rounded-lg border border-secondary bg-secondary/10 text-secondary font-label-sm text-label-sm flex items-center justify-center gap-1 h-[48px]" type="button">
<span class="material-symbols-outlined text-[16px]">remove</span>
                        Media
                    </button>
<button class="flex-1 py-2 rounded-lg border border-tertiary bg-surface-container-lowest text-tertiary font-label-sm text-label-sm flex items-center justify-center gap-1 h-[48px]" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_downward</span>
                        Baja
                    </button>
</div>
</div>
<!-- Description -->
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="task-desc">Descripción (Opcional)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-md text-on-surface placeholder:text-outline transition-colors outline-none resize-none" id="task-desc" placeholder="Añade detalles, links o notas importantes..." rows="3"></textarea>
</div>
<!-- Subtasks Section -->
<div class="space-y-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Subtareas</label>
<div class="space-y-2">
<div class="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant">
<div class="w-5 h-5 rounded border border-outline flex-shrink-0"></div>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-body-md text-on-surface outline-none" type="text" value="Leer capítulos 1-3"/>
<button class="text-outline hover:text-error transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant">
<div class="w-5 h-5 rounded border border-outline flex-shrink-0"></div>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-body-md text-on-surface outline-none" type="text" value="Escribir introducción"/>
<button class="text-outline hover:text-error transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<button class="flex items-center gap-2 text-primary font-label-sm text-label-sm hover:opacity-80 transition-opacity pt-2 h-[40px]" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Añadir subtarea
                </button>
</div>
<!-- Attachments Section -->
<div class="space-y-stack-sm bg-surface-container-low p-4 rounded-xl">
<div class="flex justify-between items-center mb-2">
<label class="font-label-sm text-label-sm text-on-surface-variant">Adjuntos</label>
<button class="text-primary hover:bg-primary/10 p-1 rounded-full transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
</button>
</div>
<div class="flex flex-wrap gap-3">
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2">
<span class="material-symbols-outlined text-[16px] text-error">picture_as_pdf</span>
<span class="font-label-sm text-label-sm text-on-surface truncate max-w-[120px]">instrucciones.pdf</span>
<button class="text-outline hover:text-error ml-1" type="button"><span class="material-symbols-outlined text-[16px]">close</span></button>
</div>
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2">
<span class="material-symbols-outlined text-[16px] text-error">picture_as_pdf</span>
<span class="font-label-sm text-label-sm text-on-surface truncate max-w-[120px]">apuntes.pdf</span>
<button class="text-outline hover:text-error ml-1" type="button"><span class="material-symbols-outlined text-[16px]">close</span></button>
</div>
</div>
</div>
</form>
<!-- Bottom Action Button (Desktop: inline, Mobile: sticky) -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-background border-t border-outline-variant/30 md:static md:bg-transparent md:border-none md:p-0 md:mt-stack-lg z-40 pb-safe">
<button class="w-full bg-primary text-on-primary font-title-md text-title-md h-[48px] rounded-lg shadow-lg shadow-primary/20 hover:shadow-primary/30 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                Guardar tarea
            </button>
</div>
</main>
</body></html>
